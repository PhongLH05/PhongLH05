<svg xmlns="http://www.w3.org/2000/svg" width="340" height="200" viewBox="0 0 340 200">
  <style>
    * {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif;
    }
  </style>
  <g class="gpsc-root">
    <rect x="1" y="1" rx="8" ry="8" height="198" width="338" stroke="#292e42" stroke-width="1" fill="#1a1b27" />
    <text x="30" y="40" style="font-size: 21px; font-weight: 600; fill: #70a5fd;">Top Mobile Stack</text>

    <!-- Legend -->
    <g transform="translate(30, 68)">
      <rect x="0" y="0" width="12" height="12" rx="3" fill="#bf91f3" />
      <text x="20" y="11" style="fill: #38bdae; font-size: 14px;">Kotlin (Android)</text>
      <text x="132" y="11" style="fill: #a9b1d6; font-size: 13px;">48%</text>

      <rect x="0" y="28" width="12" height="12" rx="3" fill="#70a5fd" />
      <text x="20" y="39" style="fill: #38bdae; font-size: 14px;">Flutter &amp; Dart</text>
      <text x="132" y="39" style="fill: #a9b1d6; font-size: 13px;">37%</text>

      <rect x="0" y="56" width="12" height="12" rx="3" fill="#f7768e" />
      <text x="20" y="67" style="fill: #38bdae; font-size: 14px;">Swift (iOS)</text>
      <text x="132" y="67" style="fill: #a9b1d6; font-size: 13px;">15%</text>
    </g>

    <!-- Donut Chart (r=42, circumference=263.89) -->
    <g transform="translate(255, 115) rotate(-90)">
      <!-- Kotlin: 48% (126.7) -->
      <circle cx="0" cy="0" r="42" fill="none" stroke="#bf91f3" stroke-width="18" stroke-dasharray="126.7 263.9" stroke-dashoffset="0" />
      <!-- Flutter/Dart: 37% (97.6) -->
      <circle cx="0" cy="0" r="42" fill="none" stroke="#70a5fd" stroke-width="18" stroke-dasharray="97.6 263.9" stroke-dashoffset="-126.7" />
      <!-- Swift: 15% (39.6) -->
      <circle cx="0" cy="0" r="42" fill="none" stroke="#f7768e" stroke-width="18" stroke-dasharray="39.6 263.9" stroke-dashoffset="-224.3" />
    </g>
  </g>
</svg>
