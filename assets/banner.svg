<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Accent Gradient for Name & Border -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Subtle Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.45" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FFFFFF" stroke-width="0.6" stroke-opacity="0.04" />
    </pattern>

    <clipPath id="cardClip">
      <rect x="2" y="2" width="896" height="226" rx="18" />
    </clipPath>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 36px;
      font-weight: 800;
      fill: #F8FAFC;
      letter-spacing: -0.5px;
    }
    .name-highlight {
      fill: url(#textGrad);
    }
    .subtitle {
      font-family: 'SF Mono', 'Fira Code', Consolas, monospace;
      font-size: 15px;
      font-weight: 500;
      fill: #94A3B8;
      letter-spacing: 0.3px;
    }
    .badge-text {
      font-family: 'SF Mono', 'Fira Code', Consolas, monospace;
      font-size: 12.5px;
      font-weight: 600;
      fill: #E2E8F0;
    }
    .code-card-text {
      font-family: 'SF Mono', 'Fira Code', Consolas, monospace;
      font-size: 12.5px;
      fill: #CBD5E1;
    }
    .float-slow {
      animation: float 6s ease-in-out infinite;
    }
    .float-delayed {
      animation: float 7s ease-in-out 1.5s infinite;
    }
    .pulse-dot {
      animation: pulse 2.2s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
  </style>

  <!-- Main Card Container -->
  <g clip-path="url(#cardClip)">
    <rect x="2" y="2" width="896" height="226" rx="18" fill="url(#bgGrad)" />
    <rect x="2" y="2" width="896" height="226" fill="url(#grid)" />

    <!-- Ambient Glowing Orbs -->
    <circle cx="120" cy="30" r="110" fill="#38BDF8" opacity="0.14" filter="url(#glow)" />
    <circle cx="760" cy="190" r="130" fill="#818CF8" opacity="0.16" filter="url(#glow)" />
    <circle cx="620" cy="40" r="90" fill="#C084FC" opacity="0.12" filter="url(#glow)" />

    <!-- Left Content: Status Pill -->
    <g transform="translate(52, 42)">
      <rect x="0" y="0" width="215" height="28" rx="14" fill="#1E293B" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
      <circle class="pulse-dot" cx="16" cy="14" r="4.5" fill="#38BDF8" />
      <text x="30" y="18.5" class="badge-text" fill="#38BDF8">Mobile App Developer</text>
    </g>

    <!-- Left Content: Main Heading -->
    <text x="52" y="118" class="title">
      Hi there, I'm <tspan class="name-highlight">Phong (LeoG)</tspan>
    </text>

    <!-- Left Content: Subtitle -->
    <text x="52" y="150" class="subtitle">
      Crafting smooth cross-platform &amp; native mobile experiences
    </text>

    <!-- Left Content: Tech Pills -->
    <g transform="translate(52, 172)">
      <!-- Flutter -->
      <rect x="0" y="0" width="88" height="28" rx="8" fill="#02569B" fill-opacity="0.22" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1" />
      <text x="44" y="18.5" text-anchor="middle" class="badge-text" fill="#7DD3FC">Flutter</text>

      <!-- Dart -->
      <rect x="98" y="0" width="70" height="28" rx="8" fill="#0175C2" fill-opacity="0.22" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1" />
      <text x="133" y="18.5" text-anchor="middle" class="badge-text" fill="#7DD3FC">Dart</text>

      <!-- Kotlin -->
      <rect x="178" y="0" width="82" height="28" rx="8" fill="#7F52FF" fill-opacity="0.2" stroke="#A78BFA" stroke-opacity="0.45" stroke-width="1" />
      <text x="219" y="18.5" text-anchor="middle" class="badge-text" fill="#C4B5FD">Kotlin</text>

      <!-- Swift -->
      <rect x="270" y="0" width="76" height="28" rx="8" fill="#F05138" fill-opacity="0.18" stroke="#FB923C" stroke-opacity="0.45" stroke-width="1" />
      <text x="308" y="18.5" text-anchor="middle" class="badge-text" fill="#FDBA74">Swift</text>
    </g>

    <!-- Right Content: Floating Code Window Illustration -->
    <g class="float-slow">
      <g transform="translate(585, 36)">
        <!-- Code Card Backdrop -->
        <rect x="0" y="0" width="265" height="158" rx="12" fill="#0F172A" fill-opacity="0.9" stroke="#334155" stroke-width="1.2" />
        <!-- Window Header Bar -->
        <rect x="0" y="0" width="265" height="28" rx="12" fill="#1E293B" />
        <rect x="0" y="16" width="265" height="12" fill="#1E293B" />
        <!-- Mac Traffic Lights -->
        <circle cx="16" cy="14" r="4.5" fill="#EF4444" />
        <circle cx="30" cy="14" r="4.5" fill="#F59E0B" />
        <circle cx="44" cy="14" r="4.5" fill="#10B981" />
        <text x="132" y="18" text-anchor="middle" class="code-card-text" font-size="11" fill="#64748B">developer.dart</text>

        <!-- Code Lines -->
        <text x="18" y="52" class="code-card-text">
          <tspan fill="#C084FC">class</tspan> <tspan fill="#38BDF8">PhongLH05</tspan> <tspan fill="#94A3B8">{</tspan>
        </text>
        <text x="32" y="74" class="code-card-text">
          <tspan fill="#94A3B8">final</tspan> role = <tspan fill="#34D399">'Mobile Dev'</tspan>;
        </text>
        <text x="32" y="96" class="code-card-text">
          <tspan fill="#94A3B8">final</tspan> stack = [
        </text>
        <text x="46" y="116" class="code-card-text">
          <tspan fill="#FBBF24">'Flutter'</tspan>, <tspan fill="#FBBF24">'Kotlin'</tspan>, <tspan fill="#FBBF24">'Swift'</tspan>
        </text>
        <text x="32" y="134" class="code-card-text">
          ];
        </text>
        <text x="18" y="150" class="code-card-text" fill="#94A3B8">}</text>
      </g>
    </g>
  </g>

  <!-- Outer Crisp Border -->
  <rect x="2" y="2" width="896" height="226" rx="18" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />
</svg>
