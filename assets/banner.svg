<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="100%" height="100%">
  <defs>
    <!-- Exact Tokyo Night Background to match Stats Cards -->
    <linearGradient id="tnBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1B27" />
      <stop offset="100%" stop-color="#16161E" />
    </linearGradient>

    <!-- Tokyo Night Title Gradient (#70A5FD -> #BF91F3) -->
    <linearGradient id="tnAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#70A5FD" />
      <stop offset="55%" stop-color="#9D7CD8" />
      <stop offset="100%" stop-color="#BF91F3" />
    </linearGradient>

    <!-- Subtle Tokyo Night Border -->
    <linearGradient id="tnBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70A5FD" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#BF91F3" stop-opacity="0.35" />
    </linearGradient>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>

    <clipPath id="bannerClip">
      <rect x="1" y="1" width="898" height="198" rx="10" />
    </clipPath>
  </defs>

  <style>
    .heading {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 32px;
      font-weight: 700;
      fill: #C0CAF5;
    }
    .accent-name {
      fill: url(#tnAccent);
    }
    .subtext {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 14.5px;
      font-weight: 400;
      fill: #A9B1D6;
    }
    .mono {
      font-family: 'SF Mono', 'Fira Code', Consolas, monospace;
      font-size: 12px;
      font-weight: 600;
    }
    .code {
      font-family: 'SF Mono', 'Fira Code', Consolas, monospace;
      font-size: 12px;
      fill: #A9B1D6;
    }
    .pulse {
      animation: pulseOp 2.4s ease-in-out infinite;
    }
    @keyframes pulseOp {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
  </style>

  <g clip-path="url(#bannerClip)">
    <!-- Card Background -->
    <rect x="1" y="1" width="898" height="198" rx="10" fill="url(#tnBg)" />

    <!-- Soft Tokyo Night Ambient Glow -->
    <circle cx="100" cy="30" r="90" fill="#70A5FD" opacity="0.10" filter="url(#softGlow)" />
    <circle cx="780" cy="160" r="100" fill="#BF91F3" opacity="0.12" filter="url(#softGlow)" />

    <!-- Role Tag -->
    <g transform="translate(44, 32)">
      <rect x="0" y="0" width="196" height="26" rx="13" fill="#24283B" stroke="#414868" stroke-width="1" />
      <circle class="pulse" cx="15" cy="13" r="4" fill="#7DCFFF" />
      <text x="28" y="17" class="mono" fill="#7DCFFF">Mobile App Developer</text>
    </g>

    <!-- Main Title -->
    <text x="44" y="98" class="heading">
      Hi there, I'm <tspan class="accent-name">Phong (LeoG)</tspan>
    </text>

    <!-- Subtitle (Sized cleanly so it never touches the right card) -->
    <text x="44" y="126" class="subtext">
      Building cross-platform &amp; native mobile apps with clean UI/UX.
    </text>

    <!-- Tokyo Night Tech Pills -->
    <g transform="translate(44, 146)">
      <rect x="0" y="0" width="78" height="26" rx="6" fill="#24283B" stroke="#70A5FD" stroke-opacity="0.45" stroke-width="1" />
      <text x="39" y="17" text-anchor="middle" class="mono" fill="#70A5FD">Flutter</text>

      <rect x="88" y="0" width="64" height="26" rx="6" fill="#24283B" stroke="#7DCFFF" stroke-opacity="0.45" stroke-width="1" />
      <text x="120" y="17" text-anchor="middle" class="mono" fill="#7DCFFF">Dart</text>

      <rect x="162" y="0" width="74" height="26" rx="6" fill="#24283B" stroke="#BF91F3" stroke-opacity="0.45" stroke-width="1" />
      <text x="199" y="17" text-anchor="middle" class="mono" fill="#BF91F3">Kotlin</text>

      <rect x="246" y="0" width="68" height="26" rx="6" fill="#24283B" stroke="#F7768E" stroke-opacity="0.45" stroke-width="1" />
      <text x="280" y="17" text-anchor="middle" class="mono" fill="#F7768E">Swift</text>
    </g>

    <!-- Right Code Box (Tokyo Night Editor Theme) -->
    <g transform="translate(590, 26)">
      <rect x="0" y="0" width="268" height="148" rx="8" fill="#16161E" stroke="#292E42" stroke-width="1.2" />
      <rect x="0" y="0" width="268" height="26" rx="8" fill="#1F2335" />
      <rect x="0" y="16" width="268" height="10" fill="#1F2335" />
      <circle cx="15" cy="13" r="4" fill="#F7768E" />
      <circle cx="28" cy="13" r="4" fill="#E0AF68" />
      <circle cx="41" cy="13" r="4" fill="#9ECE6A" />
      <text x="134" y="17" text-anchor="middle" class="code" font-size="11" fill="#565F89">profile.dart</text>

      <text x="18" y="48" class="code">
        <tspan fill="#BB9AF7">class</tspan> <tspan fill="#7DCFFF">Developer</tspan> <tspan fill="#A9B1D6">{</tspan>
      </text>
      <text x="32" y="70" class="code">
        <tspan fill="#7AA2F7">final</tspan> name = <tspan fill="#9ECE6A">'Lê Hồng Phong'</tspan>;
      </text>
      <text x="32" y="92" class="code">
        <tspan fill="#7AA2F7">final</tspan> role = <tspan fill="#9ECE6A">'Mobile Dev'</tspan>;
      </text>
      <text x="32" y="114" class="code">
        <tspan fill="#7AA2F7">final</tspan> focus = <tspan fill="#9ECE6A">'UI/UX &amp; Perf'</tspan>;
      </text>
      <text x="18" y="134" class="code" fill="#A9B1D6">}</text>
    </g>
  </g>

  <rect x="1" y="1" width="898" height="198" rx="10" fill="none" stroke="url(#tnBorder)" stroke-width="1.2" />
</svg>
